[package]
name = "agents-picker"
version = "0.1.0"
edition = "2021"
description = "Workspace-picker-style fuzzy picker for Herdr-detected agent panes"
license = "MIT"
repository = "https://github.com/yxhta/herdr-agents-picker"
readme = "README.md"
publish = false

[dependencies]
base64 = "0.22.1"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
vt100 = "0.15.2"

[lints.rust]
future-incompatible = "warn"
nonstandard-style = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_collect = "warn"
redundant_clone = "warn"

[profile.release]
lto = true
strip = true
codegen-units = 1
